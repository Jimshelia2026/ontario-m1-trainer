<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Буферная разметка полосы HOV">
<title>Буферная разметка полосы HOV</title>
<rect width="600" height="300" fill="#ffffff"/>
<rect x="40" y="50" width="520" height="50" fill="#dfe6ee"/>
<rect x="40" y="100" width="520" height="18" fill="#ffffff"/>
<line x1="140" y1="100" x2="154" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="162" y1="100" x2="176" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="184" y1="100" x2="198" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="206" y1="100" x2="220" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="228" y1="100" x2="242" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="250" y1="100" x2="264" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="272" y1="100" x2="286" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="294" y1="100" x2="308" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="316" y1="100" x2="330" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="338" y1="100" x2="352" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="360" y1="100" x2="374" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="382" y1="100" x2="396" y2="116" stroke="#8a96a3" stroke-width="5"/><line x1="404" y1="100" x2="418" y2="116" stroke="#8a96a3" stroke-width="5"/>
<rect x="40" y="118" width="520" height="50" fill="#e4eef9"/>
<rect x="40" y="168" width="520" height="50" fill="#dfe6ee"/>
<text x="60" y="82" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#1b1f24" text-anchor="start">Основные полосы (общее движение)</text>
<text x="60" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1d6fd8" text-anchor="start">Полоса HOV (провинциальное шоссе)</text>
<text x="40" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Штрихованная буферная зона между полосами (цвет по регламенту уточняется)</text><text x="40" y="269" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Пересекать её нельзя: это незаконно и небезопасно.</text><text x="40" y="288" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Схема. Не в масштабе. Источник: Driver's Handbook, стр. 89.</text>

</svg>
