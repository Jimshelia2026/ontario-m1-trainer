<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 446" role="img" aria-label="Осмотр перед поездкой"><title>Осмотр перед поездкой</title><rect width="640" height="446" fill="#ffffff"/><text x="320" y="34" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#1b1f24" text-anchor="middle">Осмотр перед поездкой</text><rect x="30" y="58" width="580" height="38" rx="8" fill="#f3f6fa" stroke="#d6dde7"/><text x="44" y="82" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1d6fd8" text-anchor="start">Шины</text><text x="230" y="82" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">давление (холодные шины), протектор</text><text x="596" y="82" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="end">стр. 28</text><rect x="30" y="102" width="580" height="38" rx="8" fill="#ffffff" stroke="#d6dde7"/><text x="44" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1d6fd8" text-anchor="start">Органы управления</text><text x="230" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">ход рычагов и рукояток</text><text x="596" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="end">стр. 28</text><rect x="30" y="146" width="580" height="38" rx="8" fill="#f3f6fa" stroke="#d6dde7"/><text x="44" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1d6fd8" text-anchor="start">Тормоза</text><text x="230" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">каждый тормоз отдельно</text><text x="596" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="end">стр. 29</text><rect x="30" y="190" width="580" height="38" rx="8" fill="#ffffff" stroke="#d6dde7"/><text x="44" y="214" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1d6fd8" text-anchor="start">Огни</text><text x="230" y="214" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">фара, стоп-сигнал, указатели</text><text x="596" y="214" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="end">стр. 29–30</text><rect x="30" y="234" width="580" height="38" rx="8" fill="#f3f6fa" stroke="#d6dde7"/><text x="44" y="258" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1d6fd8" text-anchor="start">Зеркала</text><text x="230" y="258" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">отрегулированы перед выездом</text><text x="596" y="258" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="end">стр. 29</text><rect x="30" y="278" width="580" height="38" rx="8" fill="#ffffff" stroke="#d6dde7"/><text x="44" y="302" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1d6fd8" text-anchor="start">Топливо и масло</text><text x="230" y="302" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">уровень проверен</text><text x="596" y="302" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="end">стр. 29</text><rect x="30" y="322" width="580" height="38" rx="8" fill="#f3f6fa" stroke="#d6dde7"/><text x="44" y="346" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1d6fd8" text-anchor="start">Подножка</text><text x="230" y="346" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">полностью поднята перед движением</text><text x="596" y="346" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="end">стр. 31</text><text x="30" y="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Схема не заменяет руководство; список сокращён до подтверждённых пунктов.</text><text x="30" y="422" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Источник: Motorcycle Handbook, стр. 28–31.</text></svg>
