<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-label="Основные сигналы светофора">
<title>Основные сигналы светофора</title>
<rect width="600" height="330" fill="#ffffff"/>
<rect x="60" y="30" width="110" height="200" rx="16" fill="#f2c230" stroke="#111" stroke-width="3"/>
<circle cx="115" cy="70" r="26" fill="#d7261e" stroke="#111" stroke-width="2"/>
<circle cx="115" cy="130" r="26" fill="#3a3f47" stroke="#111" stroke-width="2"/>
<circle cx="115" cy="190" r="26" fill="#3a3f47" stroke="#111" stroke-width="2"/><text x="200" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#1b1f24" text-anchor="start">Красный: остановиться (стр. 143)</text><text x="200" y="130" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#1b1f24" text-anchor="start">Жёлтый: красный скоро (стр. 143)</text><text x="200" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#1b1f24" text-anchor="start">Зелёный: можно ехать, уступая</text><text x="200" y="208" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#5b6470" text-anchor="start">(стр. 142–143)</text><text x="40" y="270" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Мигающий красный — полная остановка, дальше — когда безопасно (стр. 147).</text><text x="40" y="289" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Мигающий жёлтый — осторожно (стр. 147).</text><text x="40" y="308" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Схема. Фото официальных сигналов: Driver's Handbook, стр. 143–149.</text>
</svg>
