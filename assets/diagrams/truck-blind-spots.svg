<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="Слепые зоны большого грузовика">
<title>Слепые зоны большого грузовика</title>
<rect width="600" height="350" fill="#ffffff"/>
<rect x="110" y="60" width="260" height="120" rx="10" fill="#c9d3de" stroke="#5b6470" stroke-width="3"/>
<rect x="380" y="85" width="70" height="90" rx="8" fill="#aab6c4" stroke="#5b6470" stroke-width="2"/>
<ellipse cx="140" cy="200" rx="95" ry="26" fill="#f2c230" opacity="0.4"/>
<ellipse cx="340" cy="200" rx="95" ry="26" fill="#f2c230" opacity="0.4"/>
<rect x="530" y="200" width="22" height="40" rx="7" fill="#1d6fd8"/><text x="240" y="118" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#1b1f24" text-anchor="middle">Грузовик</text><text x="140" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#8a6a00" text-anchor="middle">Слепая зона слева</text><text x="340" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#8a6a00" text-anchor="middle">Слепая зона справа</text><text x="540" y="262" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="bold" fill="#1d6fd8" text-anchor="middle">Вы</text><text x="40" y="300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Большие слепые зоны с обеих сторон. Если вы не видите лицо</text><text x="40" y="318" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">водителя в боковом зеркале, он, вероятно, не видит вас.</text><text x="40" y="336" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Источник: Motorcycle Handbook, стр. 49. Схема не в масштабе.</text>
</svg>
