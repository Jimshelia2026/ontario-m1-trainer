<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="Левая и правая колея в полосе">
<title>Левая и правая колея в полосе</title>
<rect width="600" height="350" fill="#ffffff"/>
<rect x="90" y="50" width="420" height="200" fill="#eef1f5" stroke="#5b6470" stroke-width="3"/>
<line x1="300" y1="50" x2="300" y2="250" stroke="#f2c230" stroke-width="3" stroke-dasharray="14 10"/>
<rect x="150" y="150" width="30" height="66" rx="8" fill="#1d6fd8"/>
<rect x="390" y="150" width="30" height="66" rx="8" fill="#1d6fd8"/>
<text x="165" y="140" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#1d6fd8" text-anchor="middle">Левая колея</text>
<text x="405" y="140" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#1d6fd8" text-anchor="middle">Правая колея</text>
<text x="300" y="268" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#b42318" text-anchor="middle">Центр полосы (жёлтая линия) — не лучшее место</text>
<text x="60" y="300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Колея — блокирующее положение: дистанция, видимость, сцепление.</text><text x="60" y="318" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Выбор левой или правой колеи — по движению и условиям дороги.</text><text x="60" y="336" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Источник: Motorcycle Handbook, стр. 51 (Lane position). Схема не в масштабе.</text>

</svg>
