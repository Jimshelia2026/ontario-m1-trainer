<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="Дорожная разметка: обзор">
<title>Дорожная разметка: обзор</title>
<rect width="600" height="350" fill="#ffffff"/>
<rect x="40" y="40" width="520" height="190" fill="#e8ecf1"/>
<line x1="300" y1="40" x2="300" y2="230" stroke="#f2c230" stroke-width="5"/>
<line x1="170" y1="40" x2="170" y2="230" stroke="#fff" stroke-width="3" stroke-dasharray="16 12"/>
<line x1="60" y1="60" x2="60" y2="230" stroke="#fff" stroke-width="5"/>
<line x1="400" y1="130" x2="530" y2="130" stroke="#fff" stroke-width="6"/>
<path d="M 400 170 L 490 170 M 470 160 L 490 170 L 470 180" stroke="#fff" stroke-width="5" fill="none"/>
<text x="40" y="255" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">Жёлтая сплошная — разделяет встречное движение.</text><text x="40" y="273" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">Белая прерывистая — одно направление; обгон можно, если путь свободен.</text><text x="40" y="291" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">Белая сплошная — граница; поперечная белая — стоп-линия.</text><text x="40" y="309" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">Белая стрелка — движение только по её направлению.</text><text x="40" y="327" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">Схема. Источник: Driver's Handbook, стр. 150–153.</text>
</svg>
