<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-label="Органы управления мотоцикла"><title>Органы управления мотоцикла</title><rect width="600" height="410" fill="#ffffff"/>
<defs><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d6fd8"/></marker></defs>
<text x="300" y="34" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle">Расположение органов управления (вид сверху на руль)</text>
<line x1="120" y1="110" x2="480" y2="110" stroke="#5b6470" stroke-width="9" stroke-linecap="round"/>
<circle cx="120" cy="110" r="15" fill="#b8c2cc"/>
<circle cx="480" cy="110" r="15" fill="#1d6fd8"/>
<line x1="120" y1="110" x2="140" y2="78" stroke="#8a6a00" stroke-width="7" stroke-linecap="round"/>
<line x1="480" y1="110" x2="462" y2="78" stroke="#1a7f37" stroke-width="7" stroke-linecap="round"/>
<line x1="470" y1="116" x2="440" y2="150" stroke="#8a6a00" stroke-width="5" stroke-linecap="round"/>
<text x="120" y="62" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Сцепление</text>
<text x="480" y="62" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1d6fd8" text-anchor="middle">Передний тормоз</text>
<text x="480" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle">Газ (ручка)</text>
<circle cx="170" cy="300" r="13" fill="#b8c2cc"/>
<circle cx="430" cy="300" r="13" fill="#1d6fd8"/>
<line x1="170" y1="288" x2="170" y2="250" stroke="#8a6a00" stroke-width="6" marker-end="url(#ab)"/>
<line x1="430" y1="290" x2="470" y2="250" stroke="#1d6fd8" stroke-width="6" marker-end="url(#ab)"/>
<text x="170" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#8a6a00" text-anchor="middle">Переключение</text>
<text x="170" y="348" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#8a6a00" text-anchor="middle">(левая нога)</text>
<text x="430" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#1d6fd8" text-anchor="middle">Задний тормоз</text>
<text x="430" y="348" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1d6fd8" text-anchor="middle">(правая нога)</text>
<text x="40" y="378" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Схема. Расположение может отличаться у конкретной модели.</text>
<text x="40" y="394" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Источник: Motorcycle Handbook, стр. 19–21 и 56.</text>
</svg>
