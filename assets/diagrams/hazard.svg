<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Опасности на дороге"><title>Опасности на дороге</title><rect width="640" height="420" fill="#ffffff"/><text x="320" y="34" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#1b1f24" text-anchor="middle">Опасности: смотрите далеко вперёд</text><text x="30" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="start">Что замечать заранее:</text><text x="30" y="96" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Мокрые листья и мокрый металл — скользко (стр. 64).</text><text x="30" y="120" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Масло, особенно в центре полосы (стр. 64).</text><text x="30" y="144" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Рыхлый гравий на краю — держитесь по следам колёс (стр. 61).</text><text x="30" y="168" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Неровности и строительные участки — снизьте скорость (стр. 61).</text><text x="30" y="192" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Рельсы — пересекайте под углом не менее 45° (стр. 63).</text><text x="30" y="216" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Брызги и турбулентность от больших машин (стр. 50).</text><text x="30" y="240" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Водитель впереди может резко затормозить (стр. 40).</text><text x="30" y="300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="start">Что делать:</text><text x="30" y="324" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Смотрите как можно дальше вперёд (стр. 39).</text><text x="30" y="348" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Снижайте скорость до опасного участка, а не на нём (стр. 61).</text><text x="30" y="372" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Не тормозите резко на скользком покрытии (стр. 61, 64).</text><text x="30" y="398" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Источник: Motorcycle Handbook, стр. 39–40, 50, 61–64.</text></svg>
