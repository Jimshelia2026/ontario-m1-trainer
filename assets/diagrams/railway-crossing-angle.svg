<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Угол пересечения параллельных рельсов не менее 45 градусов">
<title>Угол пересечения параллельных рельсов не менее 45 градусов</title>
<rect width="600" height="340" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs>
<rect x="40" y="40" width="520" height="190" fill="#eef1f5"/>
<line x1="50" y1="120" x2="550" y2="120" stroke="#5b6470" stroke-width="7"/>
<line x1="50" y1="150" x2="550" y2="150" stroke="#5b6470" stroke-width="7"/>
<line x1="250" y1="210" x2="350" y2="60" stroke="#1a7f37" stroke-width="5" marker-end="url(#ah)"/>
<text x="60" y="108" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="bold" fill="#5b6470" text-anchor="start">Рельсы идут вдоль дороги</text>
<text x="370" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="start">Путь под углом 45° и более</text>
<text x="40" y="265" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Когда рельсы идут параллельно вашему пути, пересекайте их под углом</text><text x="40" y="284" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">не менее 45°. Не «подползайте» к рельсам и не тормозите на них.</text><text x="40" y="303" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Рельсы и трамвайные пути очень скользкие.</text><text x="40" y="322" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Схема не в масштабе. Источник: Motorcycle Handbook, стр. 63.</text>

</svg>
