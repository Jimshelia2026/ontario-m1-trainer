<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Передний тормоз около трёх четвертей тормозной силы">
<title>Передний тормоз около трёх четвертей тормозной силы</title>
<rect width="600" height="300" fill="#ffffff"/>
<text x="40" y="40" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1b1f24" text-anchor="start">Примерная доля тормозной силы</text>
<text x="40" y="78" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="start">Переднее колесо: около 3/4</text>
<rect x="40" y="86" width="520" height="34" rx="8" fill="#e3e8ee"/>
<rect x="40" y="86" width="390" height="34" rx="8" fill="#1d6fd8"/>
<text x="40" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="start">Заднее колесо: около 1/4</text>
<rect x="40" y="158" width="520" height="34" rx="8" fill="#e3e8ee"/>
<rect x="40" y="158" width="130" height="34" rx="8" fill="#5b6470"/>
<text x="40" y="230" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#1b1f24" text-anchor="start">Руководство советует применять оба тормоза одновременно.</text><text x="40" y="256" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#1b1f24" text-anchor="start">Не блокируйте колёса: блокировка приводит к потере управления.</text><text x="40" y="282" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#1b1f24" text-anchor="start">Источник: Motorcycle Handbook, стр. 35 и 72.</text>

</svg>
