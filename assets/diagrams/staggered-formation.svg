<rect x="60" y="40" width="480" height="200" fill="#eef1f5" stroke="#5b6470" stroke-width="2"/><line x1="300" y1="40" x2="300" y2="240" stroke="#fff" stroke-width="2" stroke-dasharray="18 12"/><rect x="164" y="70" width="32" height="40" rx="9" fill="#1d6fd8"/><text x="180" y="96" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text><rect x="404" y="110" width="32" height="40" rx="9" fill="#1d6fd8"/><text x="420" y="136" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text><rect x="164" y="160" width="32" height="40" rx="9" fill="#1d6fd8"/><text x="180" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text><rect x="404" y="200" width="32" height="40" rx="9" fill="#1d6fd8"/><text x="420" y="226" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="70" y="60" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="bold" fill="#5b6470" text-anchor="start">Левая сторона полосы</text><text x="530" y="60" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="bold" fill="#5b6470" text-anchor="end">Правая сторона</text><text x="60" y="270" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">1 — ведущий, левая сторона полосы.</text><text x="60" y="288" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">2 — правая сторона, около 1 секунды позади 1-го.</text><text x="60" y="306" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">3 — левая сторона, около 2 секунд позади 1-го.</text><text x="60" y="324" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">4 — правая сторона, около 2 секунд позади 2-го.</text><text x="60" y="342" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Источник: Motorcycle Handbook, стр. 68. Схема не в масштабе.</text>
