<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Перекрёсток: уступание и смещение"><title>Перекрёсток: уступание и смещение</title><rect width="640" height="520" fill="#ffffff"/><text x="320" y="34" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="middle">Перекрёсток: кто уступает и как отойти от машины</text><rect x="250" y="60" width="140" height="190" fill="#d9dee6"/><rect x="60" y="130" width="520" height="80" fill="#d9dee6"/><line x1="320" y1="60" x2="320" y2="250" stroke="#f5c542" stroke-width="3" stroke-dasharray="10 10"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a7f37"/></marker></defs><rect x="300" y="170" width="16" height="36" rx="5" fill="#1d6fd8"/><text x="282" y="198" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="normal" fill="#1d6fd8" text-anchor="end">мотоцикл</text><rect x="195" y="88" width="40" height="22" rx="4" fill="#5b6470"/><text x="215" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="normal" fill="#5b6470" text-anchor="middle">машина</text><line x1="324" y1="186" x2="362" y2="162" stroke="#1a7f37" stroke-width="3" marker-end="url(#a)"/><text x="30" y="290" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Смещайтесь от машины, которая может выехать:</text><text x="30" y="312" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Машина справа — переместитесь влево.</text><text x="30" y="333" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Машина слева или встречная, поворачивающая налево — вправо.</text><text x="30" y="374" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Правила уступания:</text><text x="30" y="396" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">• Без знаков: уступите подъезжавшему раньше; одновременно — справа.</text><text x="30" y="416" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">• Все стороны «Стоп»: уступите первому остановившемуся.</text><text x="30" y="436" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">• Поворот налево: пропустите встречных и пешеходов.</text><text x="30" y="456" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">• Поворот направо: пропустите пешеходов.</text><text x="30" y="476" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">• Перед поворотом проверьте слепую зону на велосипедистов.</text><text x="30" y="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="normal" fill="#5b6470" text-anchor="start">Источник: Motorcycle Handbook, стр. 42; Driver’s Handbook, стр. 54.</text></svg>
