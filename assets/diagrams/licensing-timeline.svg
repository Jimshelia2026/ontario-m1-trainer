<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Сроки лицензии M1 и M2 в Онтарио">
<title>Сроки лицензии M1 и M2 в Онтарио</title>
<rect width="600" height="300" fill="#ffffff"/>
<line x1="60" y1="130" x2="540" y2="130" stroke="#5b6470" stroke-width="4"/>
<circle cx="70" cy="130" r="9" fill="#1d6fd8"/><circle cx="230" cy="130" r="9" fill="#1d6fd8"/><circle cx="400" cy="130" r="9" fill="#1d6fd8"/><circle cx="530" cy="130" r="9" fill="#1a7f37"/>
<text x="70" y="100" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1d6fd8" text-anchor="middle">M1</text><text x="70" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="middle">Начало</text>
<text x="230" y="100" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle">60 дней</text><text x="230" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="middle">минимум</text>
<text x="400" y="100" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle">Road test</text><text x="400" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="middle">Level One → M2</text>
<text x="530" y="100" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1a7f37" text-anchor="middle">M</text><text x="530" y="160" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="middle">полная</text>
<text x="40" y="220" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#1b1f24" text-anchor="start">M1 действительна 90 дней.</text><text x="40" y="242" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#1b1f24" text-anchor="start">Level Two: минимум 22 месяца (на 4 месяца меньше с одобренным курсом).</text><text x="40" y="264" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#1b1f24" text-anchor="start">Источник: Motorcycle Handbook, стр. 6–8. Схема не в масштабе.</text>

</svg>
