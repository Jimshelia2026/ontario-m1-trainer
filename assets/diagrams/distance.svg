<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-label="Дистанция: две секунды"><title>Дистанция: две секунды</title><rect width="640" height="390" fill="#ffffff"/><text x="320" y="34" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#1b1f24" text-anchor="middle">Дистанция до впереди идущего</text><rect x="90" y="90" width="90" height="48" rx="6" fill="#5b6470"/><text x="135" y="120" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">авто</text><rect x="440" y="90" width="90" height="48" rx="6" fill="#1d6fd8"/><text x="485" y="120" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">мотоцикл</text><line x1="185" y1="114" x2="438" y2="114" stroke="#1a7f37" stroke-width="3" marker-start="url(#b)" marker-end="url(#b)"/><defs><marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a7f37"/></marker></defs><text x="312" y="104" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle">минимум 2 секунды</text><text x="30" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="start">Как считать:</text><text x="30" y="204" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">«одна тысяча один, одна тысяча два» — когда отмечаете ориентир</text><text x="30" y="226" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">Ориентир пройден раньше — вы слишком близко.</text><text x="30" y="266" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="start">Увеличьте интервал:</text><text x="30" y="290" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• В плохую погоду и при плохой видимости (стр. 46).</text><text x="30" y="314" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• За большими машинами — им нужен больший тормозной путь (стр. 49).</text><text x="30" y="338" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Если впереди стоит машина, оставьте место, чтобы объехать её (стр. 46–47).</text><text x="30" y="372" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Источник: Motorcycle Handbook, стр. 46–49.</text></svg>
