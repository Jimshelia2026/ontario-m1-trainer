<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Торможение на пределе сцепления">
<title>Торможение на пределе сцепления</title>
<rect width="600" height="320" fill="#ffffff"/>
<text x="300" y="36" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1b1f24" text-anchor="middle">Торможение на пределе сцепления (threshold braking)</text><rect x="60" y="60" width="480" height="46" rx="9" fill="#1d6fd8"/><text x="78" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">1. Плавно тормозить обоими тормозами</text><text x="78" y="98" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="start">без блокировки колёс</text><rect x="60" y="116" width="480" height="46" rx="9" fill="#b42318"/><text x="78" y="136" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">2. Колесо заблокировалось</text><text x="78" y="154" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="start">сразу заметно, нужно вмешаться</text><rect x="60" y="172" width="480" height="46" rx="9" fill="#1d6fd8"/><text x="78" y="192" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">3. Кратко отпустить тормоз</text><text x="78" y="210" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="start">дать колесу снова раскрутиться</text><rect x="60" y="228" width="480" height="46" rx="9" fill="#1d6fd8"/><text x="78" y="248" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">4. Снова нажать тормоз, но не до блокировки</text><text x="78" y="266" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="start">торможение на пределе сцепления</text><text x="300" y="300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#5b6470" text-anchor="middle">Для мотоцикла без ABS. Источник: Motorcycle Handbook, стр. 72.</text>
</svg>
