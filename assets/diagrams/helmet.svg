<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Шлем мотоциклиста: проверка"><title>Шлем мотоциклиста: проверка</title><rect width="640" height="400" fill="#ffffff"/><text x="320" y="34" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#1b1f24" text-anchor="middle">Шлем мотоциклиста</text><circle cx="120" cy="150" r="62" fill="#e8eef7" stroke="#1d6fd8" stroke-width="4"/><path d="M62 160 Q120 60 178 160" fill="none" stroke="#1d6fd8" stroke-width="10" stroke-linecap="round"/><path d="M96 196 Q120 228 144 196" fill="none" stroke="#1a7f37" stroke-width="5"/><text x="120" y="262" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#1a7f37" text-anchor="middle">ремешок застёгнут</text><text x="290" y="80" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="start">Проверьте:</text><text x="290" y="106" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Одобрен для Онтарио (Regulation 610)</text><text x="290" y="134" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Ремешок застёгнут под подбородком</text><text x="290" y="162" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Плотно сидит и не сдвигается</text><text x="290" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Full-face даёт лучшую защиту</text><text x="290" y="218" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#1b1f24" text-anchor="start">• Визор защищает глаза от ветра и насекомых</text><text x="30" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Исключение для сикхов — по закону (Regulation 610 (6)).</text><text x="30" y="372" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="normal" fill="#5b6470" text-anchor="start">Источник: Motorcycle Handbook, стр. 16–17; ontario.ca «Get a motorcycle licence».</text></svg>
