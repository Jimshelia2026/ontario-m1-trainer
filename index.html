<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontario M1 — тренажёр знаний</title>
<style>
  :root {
    --fs: 18px;
    --bg: #f7f8fa; --card: #ffffff; --text: #1b1f24; --muted: #5b6470;
    --line: #d9dee5; --blue: #1d6fd8;
    --green: #1a7f37; --greenbg: #e6f6ec;
    --red: #b42318; --redbg: #fdeaea;
  }
  body.dark {
    --bg: #15181d; --card: #1f242b; --text: #eef1f5; --muted: #a7b0bc;
    --line: #3a424d; --blue: #5ea4ff;
    --green: #4cc370; --greenbg: #1d3a27;
    --red: #ff8a80; --redbg: #44232a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: var(--fs); line-height: 1.55;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 1.1rem; margin: 0; }
  h2 { margin-top: 0; }
  h3 { margin: 18px 0 8px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btn, nav button, select {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  nav button.active, .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  button:disabled { opacity: .45; cursor: default; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: .88em; margin-bottom: 10px; }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .q { font-size: 1.22em; font-weight: 600; margin: 6px 0 14px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    padding: 14px 16px; margin: 8px 0; border: 2px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); font: inherit; cursor: pointer;
  }
  button.opt:disabled { cursor: default; opacity: 1; }
  .opt .letter { font-weight: 700; min-width: 1.4em; }
  .opt .mark { margin-left: auto; font-weight: 700; white-space: nowrap; padding-left: 10px; }
  .opt.correct { border-color: var(--green); background: var(--greenbg); }
  .opt.correct .mark { color: var(--green); }
  .opt.wrong { border-color: var(--red); background: var(--redbg); }
  .opt.wrong .mark { color: var(--red); }
  .opt.selected { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
  .expl { margin-top: 14px; padding: 14px; border-left: 4px solid var(--blue); background: var(--bg); border-radius: 8px; }
  .expl.plain { border-left-color: var(--line); }
  .src { font-size: .85em; color: var(--muted); margin-top: 10px; }
  .note { color: var(--muted); font-size: .9em; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; justify-content: space-between; align-items: center; }
  .hidden { display: none !important; }
  .lesson-img { width:100%; max-height:260px; object-fit:contain; background:#f1f5f9; border-radius:12px; margin:14px 0; }
  .lesson-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:9px; margin:16px 0; }
  .lesson-list button { text-align:left; padding:13px; border-radius:10px; border:1px solid var(--line); background:var(--card);color:var(--text);cursor:pointer;font:inherit; }
  .lesson-list button.active { border:2px solid var(--blue); }
  .lesson-block { background:var(--bg);border-radius:10px;padding:14px;margin:12px 0; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .progress > div { height: 100%; background: var(--blue); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin: 14px 0 4px; }
  .grid button {
    padding: 8px 0; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--text); cursor: pointer; font: inherit;
  }
  .grid button.answered { background: var(--blue); color: #fff; border-color: var(--blue); }
  .grid button.cur { outline: 3px solid var(--blue); outline-offset: 1px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 10px 0 16px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; }
  .stat span { color: var(--muted); font-size: .9em; }
  .stat strong { font-size: 1.6rem; }
  .stat small { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; display: block; overflow-x: auto; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  label { color: var(--muted); }
  select { margin-left: 6px; max-width: 100%; }
  .opt .mark { white-space: normal; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
  .bar label { max-width: 100%; }
  .signbox {
    display: flex; justify-content: center; align-items: center; background: #fff;
    border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin: 6px 0 14px;
  }
  .signbox img { max-width: 100%; width: min(360px, 100%); height: auto; }
  .sign-ru { font-size: 1.3em; font-weight: 700; margin: 4px 0; color: var(--green); }
  .sign-en { color: var(--muted); margin-bottom: 10px; font-style: italic; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    main { padding: 12px; }
    .card { padding: 16px; }
    .bar label { display: flex; flex-direction: column; width: 100%; }
    .bar select { margin: 4px 0 0; width: 100%; }
    .opt .mark { padding-left: 4px; font-size: .85em; }
  }
  .banner { border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:0 0 10px; background:var(--card); color:var(--text); }
  .banner.warn { border-color:var(--red); color:var(--red); }

  /* ---- v6.3 мобильный интерфейс: компактная шапка и меню-шторка (≤719px); десктоп не меняется ---- */
  html { -webkit-text-size-adjust: 100%; }
  .menu-btn, .menu-head, .menu-backdrop { display: none; }
  .menu-panel { display: contents; }
  .title-short { display: none; }
  @media (max-width: 719px), (max-height: 500px) {
    header { position: sticky; top: 0; z-index: 30; flex-wrap: nowrap; justify-content: space-between; align-items: center; gap: 8px; min-height: 52px; padding: 4px 12px; }
    header h1 { flex: 1 1 auto; min-width: 0; font-size: 1rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title-full { display: none; }
    .title-short { display: inline; }
    .menu-btn { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; min-width: 44px; min-height: 44px; padding: 0; font-size: 22px; line-height: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
    .menu-panel[hidden] { display: none; }
    .menu-panel { display: flex; flex-direction: column; gap: 10px; position: fixed; left: 50%; top: 0; transform: translateX(-50%); width: 100%; max-width: 440px; z-index: 40; max-height: calc(100vh); max-height: 100dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: env(safe-area-inset-top, 0px) 12px calc(env(safe-area-inset-bottom, 0px) + 16px); background: var(--card); box-shadow: 0 10px 28px rgba(0,0,0,.28); }
    .menu-head { display: flex; align-items: center; justify-content: space-between; min-height: 52px; margin: 0 -12px; padding: 4px 12px; border-bottom: 1px solid var(--line); }
    .menu-head strong { font-size: 1.05rem; }
    .menu-close { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0; font-size: 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
    .menu-panel nav { display: flex; flex-direction: column; gap: 6px; }
    .menu-panel nav button { width: 100%; min-height: 48px; padding: 12px 14px; text-align: left; font-size: 1rem; }
    .menu-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .menu-tools button { min-height: 48px; }
    .menu-tools .dark-btn { grid-column: 1 / -1; }
    .menu-backdrop { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.35); touch-action: none; }
    .menu-backdrop[hidden] { display: none; }
    body.menu-open { overflow: hidden; }
    main { max-width: none; padding: 10px 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
    .card { padding: 14px; border-radius: 12px; }
    .meta { font-size: .8em; margin-bottom: 8px; }
    .q { font-size: 1.1em; margin: 4px 0 12px; overflow-wrap: anywhere; }
    .opt { min-height: 48px; padding: 12px 14px; margin: 6px 0; overflow-wrap: anywhere; }
    .expl, .src { overflow-wrap: anywhere; }
    .expl { font-size: .95em; }
    .btn, select { min-height: 44px; }
    .grid button { min-height: 44px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .row > * { min-width: 0; }
    .row .toolbar { grid-column: 1 / -1; order: 2; }
    .row > [data-act="prev"] { order: 0; }
    .row > [data-act="next"] { order: 1; }
    .row > [data-act="prev"], .row > [data-act="next"] { min-height: 48px; }
    .e64-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .e64-nav [data-e64="prev"] { order: 0; }
    .e64-nav [data-e64="next"] { order: 1; }
    .e64-nav [data-e64="home"] { order: 2; }
    .e64-nav [data-e64="submit"] { order: 3; }
    .e64-nav > .btn { min-height: 48px; }
    .card:has(> .e64-nav) { display: flex; flex-direction: column; }
    .card:has(> .e64-nav) > .e64-nav { order: 1; margin-top: 14px; }
    .card:has(> .e64-nav) > .grid { order: 2; }
    .card:has(> .e64-nav) > .note { order: 3; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="title-full">Ontario M1 — тренажёр знаний</span><span class="title-short">Ontario M1</span></h1>
  <button type="button" id="menuBtn" class="menu-btn" aria-expanded="false" aria-controls="menuPanel" aria-label="Открыть меню разделов">☰</button>
  <div id="menuPanel" class="menu-panel" role="dialog" aria-modal="true" aria-label="Меню разделов" hidden>
    <div class="menu-head">
      <strong>Разделы</strong>
      <button type="button" id="menuClose" class="menu-close" aria-label="Закрыть меню">✕</button>
    </div>
    <nav id="mainNav" aria-label="Разделы">
      <button data-mode="learn" class="active">Обучение</button>
      <button data-mode="practice">Практика</button>
      <button data-mode="exam">Симуляция M1</button>
      <button data-mode="exam64">Симуляция 64</button>
      <button data-mode="mistakes">Ошибки</button>
      <button data-mode="signs">Дорожные знаки</button>
      <button data-mode="progress">Прогресс</button>
      <button data-mode="lessons">Визуальные уроки</button>
    </nav>
    <div class="toolbar menu-tools">
      <button class="btn" data-act="fs" data-v="-1" aria-label="Уменьшить текст">A−</button>
      <button class="btn" data-act="fs" data-v="1" aria-label="Увеличить текст">A+</button>
      <button class="btn dark-btn" data-act="dark">Тёмная тема</button>
    </div>
  </div>
  <div id="menuBackdrop" class="menu-backdrop" hidden></div>
</header>
<div id="banner" style="max-width:900px;margin:12px auto 0;padding:0 20px"></div>
<main>
  <div id="scopeBar" class="bar">
    <label>Раздел: <select id="scope"></select></label>
  </div>
  <div id="signBar" class="bar hidden">
    <label>Категория: <select id="sscope"></select></label>
    <label>Режим: <select id="signSub">
      <option value="learn">Изучение (значение сразу)</option>
      <option value="quiz">Викторина (выбор ответа)</option>
    </select></label>
  </div>
  <div id="stage"></div>
</main>
<script src="questions.js"></script>
<script src="signs.js"></script>
<script src="lessons.js"></script>
<script src="app.js"></script>
<script src="exam64.js"></script>
<script src="mobile-nav.js"></script>
</body>
</html>
